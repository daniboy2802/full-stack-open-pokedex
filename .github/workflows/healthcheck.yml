name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed app
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://pokedex-daniboy2802.fly.dev/health
          max-attempts: 3
          retry-delay: 5s
